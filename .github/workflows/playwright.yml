name: Playwright - Game Validation

on:
  push:
    branches: [main]
    paths-ignore:
      - "version.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm test


      - name: Publish successful build version for auto-refresh
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > version.json
          if ! git diff --quiet -- version.json; then
            git add version.json
            git commit -m "chore: publish tested build version [skip ci]"
            git push
          fi

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minegame-baseline-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
